networks:
  pixora:
    external: true

services:
  tags_app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - ${APP_PORT}:${APP_PORT}
    environment:
      - DB_HOST=tags-postgres-db # container_name of db
    networks:
      - pixora
    env_file:
      - .env
    container_name: tags-app

  tags_postgres_db:
    image: postgres
    restart: always
    ports:
      - ${DB_PORT}:${DB_PORT}
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_SSL_MODE=${SSL_MODE}
    command: postgres -p ${DB_PORT}
    networks:
      - pixora
    volumes:
      - /var/lib/postgresql/18/docker
    env_file:
      - .env
    container_name: tags-postgres-db